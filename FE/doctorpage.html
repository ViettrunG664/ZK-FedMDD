<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, initial-scale=1.0" />
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="doctorpage.css" />
</head>

<body>
    <div class="doctor-container">
        <!-- Thông tin bác sĩ -->
        <div class="doctor-info">
            <h2>Doctor Information</h2>
            <div class="info-row">
                <span class="label">Hash ID:</span>
                <span class="value" id="doctor-hash">12345ABCDE67890...</span>
            </div>
            <div class="info-row">
                <span class="label">Department:</span>
                <span class="value" id="department-name">Cardiology</span>
                <button class="toggle-hash-btn" onclick="toggleDepartmentHash()" title="Switch department display">
                    <!-- SVG icon chuyển đổi -->
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#00796b" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="10" stroke="#00796b" />
                        <polyline points="8,7 11,4 14,7" />
                        <polyline points="8,15 11,18 14,15" />
                        <line x1="11" y1="4" x2="11" y2="18" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Danh sách bệnh nhân -->
        <div class="patients-section">
            <h3>List of patients by department</h3>
            <input type="text" id="search-patient" class="search-input" placeholder="Search by #number or hash ID...">
            <div class="patient-box">
                <ul class="patients-list" id="patients-list">
                    <!-- Danh sách render bằng JS -->
                </ul>
            </div>
        </div>

        <script src="doctorpage.js"></script>
</body>

</html>
