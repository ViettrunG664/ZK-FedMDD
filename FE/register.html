<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=600, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="register.css" />
  <link rel="stylesheet" href="loading.css" />
</head>

<body>
  <div class="register-container">
    <h2>Register</h2>
    <form id="registerForm">
      <label for="username">Practitioner ID (format: BV.&lt;HOSPITAL&gt;:&lt;8-char-DOCTOR-ID&gt;)</label>
      <input type="text" pattern="BV\.[A-Z0-9]+:[A-Z0-9]{8}" maxlength="32" id="username" name="username"
        placeholder="e.g. BV.HOSPA:A3X7K2PQ" required style="text-transform:uppercase" />

      <label for="role">Role</label>
      <div class="role-select">
        <select id="role" name="role" required>
          <option value="" disabled selected>Select role</option>
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <button type="submit">Register</button>
      <p class="login-link">Already have an account? <a href="http://localhost:3000/login.html">Login</a></p>
    </form>
  </div>

  <div id="popup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
      <h3>Congratulation</h3>
      <p id="Salt-number">You have successfully registered!</p>
      <button onclick="copySalt()">Copy</button>
      <button onclick="downloadCongrats()">Download TXT</button>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>

  <script src="register.js"></script>
</body>

</html>
