experiment:
  version: "v6"
  name: "D-vlog Only"

data:
  dataset: "dvlog"
  dataset_dir: "data/dvlog-dataset"

features:
  audio:
    fps: 1.0
  visual:
    fps: 1.0
  text:
    enabled: false

preprocessing:
  segment_duration: 8.0
  normalize: true
  norm_method: "zscore"
  windowing:
    enabled: true
    window_size: 32
    stride: 16
    pad_short: true

model:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.4
  fusion: "attention"

training:
  batch_size: 32
  num_epochs: 60
  learning_rate: 0.0005
  weight_decay: 0.001
  label_smoothing: 0.05
  patience: 15
  class_weight: true
  ensemble: 1

seed: 42
device: "auto"
